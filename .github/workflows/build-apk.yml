name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK
        uses: android-actions/setup-android@v3


      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "cmdline-tools;latest"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-dev \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Python tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer
          python3 -m pip install Cython==0.29.36


      - name: Extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project


      - name: Find Buildozer project
        run: |
          SPEC=$(find project -type f -name "buildozer.spec" | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project directory:"
          echo "$PROJECT_DIR"


      - name: Configure Buildozer
        run: |
          cd "$PROJECT_DIR"

          sed -i 's/^android.api = .*/android.api = 31/' buildozer.spec || true
          sed -i 's/^android.minapi = .*/android.minapi = 23/' buildozer.spec || true


      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          buildozer android debug


      - name: Show APK files
        if: always()
        run: |
          find project -type f -name "*.apk" || true


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-trader-pro-apk
          path: project/**/bin/*.apk
          if-no-files-found: error
