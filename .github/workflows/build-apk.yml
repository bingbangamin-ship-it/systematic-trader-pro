name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-dev \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer
          python3 -m pip install Cython==0.29.36


      - name: Extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project


      - name: Find Buildozer project
        run: |
          SPEC=$(find project -type f -name "buildozer.spec" | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project: $PROJECT_DIR"


      - name: Configure Buildozer
        run: |
          cd "$PROJECT_DIR"

          cat >> buildozer.spec << 'EOF'

          android.api = 31
          android.minapi = 23
          android.ndk = 25b
          android.accept_sdk_license = True
          EOF

          echo "Final Buildozer configuration:"
          cat buildozer.spec


      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          buildozer android debug


      - name: Show APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find project -type f -name "*.apk" || true


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-trader-pro-apk
          path: project/**/bin/*.apk
          if-no-files-found: error
