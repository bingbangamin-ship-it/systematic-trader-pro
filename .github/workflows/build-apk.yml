name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK
        uses: android-actions/setup-android@v3


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install required Android tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "build-tools;31.0.0"


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-dev \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer
          python3 -m pip install Cython==0.29.36


      - name: Extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project


      - name: Find Buildozer project
        run: |
          SPEC=$(find project -type f -name "buildozer.spec" | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV


      - name: Configure Buildozer
        run: |
          cd "$PROJECT_DIR"

          sed -i 's/^android.api = .*/android.api = 31/' buildozer.spec || true
          sed -i 's/^android.minapi = .*/android.minapi = 23/' buildozer.spec || true

          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec


      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd "$PROJECT_DIR"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          buildozer android debug


      - name: Find APK
        if: always()
        run: |
          echo "Generated APK files:"
          find project -type f -name "*.apk" || true


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-trader-pro-apk
          path: project/**/bin/*.apk
          if-no-files-found: error
