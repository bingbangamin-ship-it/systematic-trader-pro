name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-dev \
            python3-setuptools \
            python3-wheel \
            git \
            wget \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer Cython==0.29.36

      - name: Extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

      - name: Find project
        run: |
          SPEC=$(find project -type f -name "buildozer.spec" | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Prepare Android SDK
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk

          mkdir -p "$SDK_DIR"

          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf temp-sdk
          mkdir temp-sdk

          unzip -q commandlinetools-linux-11076708_latest.zip -d temp-sdk

          mkdir -p "$SDK_DIR/cmdline-tools/latest"

          mv temp-sdk/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"

          mkdir -p "$SDK_DIR/tools/bin"

          ln -sf \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"

          chmod +x "$SDK_DIR/tools/bin/sdkmanager"

          export ANDROID_HOME="$SDK_DIR"

          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            --licenses

          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;37.0.0"

      - name: Configure project
        run: |
          cd "$PROJECT_DIR"

          sed -i '/^android.api/d' buildozer.spec
          sed -i '/^android.minapi/d' buildozer.spec
          sed -i '/^android.ndk/d' buildozer.spec

          echo "" >> buildozer.spec
          echo "android.api = 31" >> buildozer.spec
          echo "android.minapi = 23" >> buildozer.spec
          echo "android.ndk = 28c" >> buildozer.spec

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          buildozer -v android debug

      - name: Show APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find project -type f -name "*.apk" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systematic-trader-pro-apk
          path: project/**/bin/*.apk
          if-no-files-found: error
